# Root documents. One table per compiled PDF.
#
# The table name is the document id, and everything mechanical follows from it:
#
#     [main]  ->  root main.tex, build out/main.pdf, release tag main-v0.1.0
#
# so a document is added by adding a table, and nothing else has to be told
# about it. Set `root` only when the file is not <id>.tex.
#
# A table is a document iff it carries `version`; anything else here is
# repository configuration.
#
# `version` is the only version authority in this repository -- there is no
# VERSION file. VersionCheck.yml requires a one-step semver bump on every PR,
# and Release.yml tags <id>-v<version>. Bump with `./scripts/bump.sh <id>`.
#
# The dependency closure of a document is NOT listed here. It is derived from
# the document's own build record -- see scripts/closure.py. A hand-maintained
# list drifts; latexmk's records cannot.
#
# `style` names the preamble under styles/ that the root reads, and CI checks
# the root really does \input it -- a key that can drift silently is worse than
# no key. `arxiv` adds the .tex + .bbl + figures submission bundle to the
# release; it is meaningless for a working notebook, so it defaults off.

[main]
style   = "revtex"
arxiv   = true
version = "0.0.12"

[notes]
style   = "article"
version = "0.1.0"
