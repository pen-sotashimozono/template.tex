<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Office / macOS fonts the runner lacks, mapped to what it has. -->
<fontconfig>
  <alias binding="same"><family>游ゴシック Light</family><accept><family>Noto Sans CJK JP Light</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Gothic Light</family><accept><family>Noto Sans CJK JP Light</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>游ゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>游ゴシック Medium</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>YuGothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Gothic UI</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Hiragino Sans</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ヒラギノ角ゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Hiragino Kaku Gothic ProN</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ヒラギノ角ゴ ProN</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>メイリオ</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Meiryo</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS PGothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ ゴシック</family><accept><family>Noto Sans Mono CJK JP</family></accept></alias>
  <alias binding="same"><family>MS Gothic</family><accept><family>Noto Sans Mono CJK JP</family></accept></alias>
  <alias binding="same"><family>游明朝</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Mincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>YuMincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Hiragino Mincho ProN</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>ヒラギノ明朝 ProN</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ 明朝</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>MS Mincho</family><accept><family>Noto Serif CJK JP</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Calibri Light</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Aptos</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Liberation Sans</family></accept></alias>
  <!-- LibreOffice fills an empty East Asian font with its default CJK face,
       the Chinese one outside a Japanese locale; hide the non-Japanese faces
       so it lands on Noto CJK JP. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK HK</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono CJK KR</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
