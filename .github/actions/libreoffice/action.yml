name: LibreOffice
description: Headless LibreOffice with Japanese fonts, and Office fonts mapped to free equivalents.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libreoffice-impress libreoffice-writer python3-uno \
          fonts-noto-cjk fonts-noto-cjk-extra fonts-liberation2 \
          fonts-crosextra-carlito fonts-crosextra-caladea
        mkdir -p ~/.config/fontconfig
        cp "$GITHUB_ACTION_PATH/fonts.conf" ~/.config/fontconfig/fonts.conf
        fc-cache -f >/dev/null
