name: Initialize from template

# Runs once in a repository generated from this template, then deletes itself.
# Resets every document to 0.1.0, clears the template's changelog, removes
# LICENSE, which covers the template rather than the work written with it,
# re-pins the tikz-tensors and .claude (claude-tex) submodules, which the copy
# leaves empty, and deletes SyncTikzTensors.yml, which only the template runs.
#
# Guarded twice: is_template is true only in the template repository itself,
# and the slug exclusion is a backstop. Self-deletion is the third.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  init:
    name: Reset versions to 0.1.0
    # Skip in the template repo; run only in repos created from it.
    # Two guards: is_template flag, and an explicit slug exclusion as a backstop.
    if: ${{ github.event.repository.is_template == false && github.repository != 'pen-sotashimozono/template.tex' }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Initialize versions and remove this workflow
        run: |
          set -euo pipefail
          # Already initialized (workflow somehow ran twice)? Nothing to do.
          if [ ! -f .github/workflows/Initialize.yml ]; then
            echo "Initialize.yml already removed — skipping."
            exit 0
          fi

          # Every document in docs.toml, whatever they are called.
          python3 .github/scripts/docs.py init 0.1.0

          # The template's own changelog documents the template, not this
          # project, and would sit above a 0.1.0 that never followed from it.
          cat > .github/CHANGELOG.md <<'EOF'
          # Changelog

          One entry per released version, newest first, headed by the tag it ships
          under. Each document in `docs.toml` has its own ladder, so entries
          interleave: `v0.1.4-main` may sit above `v0.3.0-notes`. The PR that bumps
          a version adds its entry here, so the history is readable in-repo without
          downloading release artifacts. `./.github/scripts/bump.sh <document> <kind>
          "summary"` prepends the stub.

          To see what actually changed in a document between two of its versions:

          ```sh
          git diff v0.1.0-main v0.1.1-main -- '*.tex'     # text, greppable — prefer this
          ./.github/scripts/diff.sh v0.1.0-main v0.1.1-main       # rendered latexdiff PDF, for reading
          ```

          <!-- new entries go directly below this line -->
          EOF

          # The template's MIT licence covers the template, not the work written
          # with it. Left in place it would sit in a paper repository claiming
          # to license the paper, which is almost never what the author meant.
          rm -f LICENSE

          # "Use this template" copies .gitmodules but not the commit a submodule
          # is pinned at, so tikz-tensors (the figures' TikZ format) comes back
          # empty. Pin it afresh at its newest release; this stages both.
          .github/tools/figures/tikz-tensors.sh ensure

          # The same holds for .claude (claude-tex, the shared rules and
          # skills): add it afresh at its main when the copy left no pin.
          if [ -z "$(git ls-files -s -- .claude | awk '$1 == "160000"')" ]; then
            find .claude -delete 2>/dev/null || true
            git submodule add --force https://github.com/pen-sotashimozono/claude-tex .claude
            git add .gitmodules .claude
          fi

          # The daily sync keeps the template itself on tikz-tensors' main; a
          # project moves when it chooses (tikz-tensors.sh pin), so it goes.
          rm -f .github/workflows/SyncTikzTensors.yml

          rm .github/workflows/Initialize.yml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs.toml .github/CHANGELOG.md LICENSE .github/workflows/Initialize.yml \
            .github/workflows/SyncTikzTensors.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # [skip ci] so this bootstrap commit does not kick off the LaTeX/release pipelines.
          git commit -m "chore: initialize from template (version 0.1.0) [skip ci]"
          git push origin HEAD
