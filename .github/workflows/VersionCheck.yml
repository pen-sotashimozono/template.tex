name: Version Check

# Every PR to main MUST bump the version of every document in docs.toml by
# exactly one semver step (patch, minor, or major). An unchanged version fails:
# each merged PR is a release, so the version never silently stands still and
# every merge leaves a comparable snapshot (document PDF + latexdiff against
# the previous tag).
#
# The comparison is against the CURRENT tip of the base branch, not the state
# at PR creation. If another PR merges first, this check goes red until the
# branch takes main in and re-bumps — that is intended: the ladder must stay
# single-step. Use `scripts/bump.sh <document> patch` to bump.
#
# The rule is "every document" only because there is one. Once the second root
# document lands (#17) this passes `--only` from `closure.py affected`, so a PR
# bumps exactly the documents whose dependency closure it touched — and a PR
# that touches none of them, like a CI or README change, needs no bump at all.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Validate semver bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare docs.toml against base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          # An absent docs.toml on the base leaves an empty manifest, which
          # reads every document as new — check-bump accepts that as initial.
          git show "FETCH_HEAD:docs.toml" > base-docs.toml 2>/dev/null || : > base-docs.toml
          python3 scripts/docs.py check-bump --base base-docs.toml
