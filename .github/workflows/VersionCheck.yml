name: Version Check

# Thin caller. Answers in seconds without a LaTeX build, and still runs when a
# build fails -- when the closure-aware check in latex-ci.yml cannot.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: pen-sotashimozono/.github/.github/workflows/paper-version-check.yml@v1
