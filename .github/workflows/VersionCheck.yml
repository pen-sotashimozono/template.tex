name: Version Check

# Every version in .github/docs.toml is either unchanged or exactly one semver
# step from the base branch. Nothing else is allowed: no two-step jumps, no
# going backwards, no X.Y or 1.2.3.4.
#
# This does NOT decide which documents ought to have been bumped. That is the
# version-check job in latex-ci.yml, which asks each document's dependency
# closure and therefore needs the build records latexmk writes.
#
# Keeping the weaker rule separate buys two things the stronger one cannot
# give. It answers in seconds instead of after a LaTeX build, so a mistyped
# version is caught immediately. And it still runs when a build fails -- which
# is precisely when the closure-driven check cannot run at all, because its job
# depends on the build matrix.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Validate semver step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare docs.toml against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A shallow fetch is enough: this reads one blob and never needs a
          # merge base, unlike the closure diff in latex-ci.yml.
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # An absent manifest on the base leaves an empty one, which reads
          # every document as new -- accepted, since there is nothing to step
          # from.
          git show "FETCH_HEAD:.github/docs.toml" > base-docs.toml 2>/dev/null || : > base-docs.toml
          python3 .github/scripts/docs.py check-step --base base-docs.toml
