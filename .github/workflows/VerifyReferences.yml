name: Verify references

# Thin caller. contact-email is passed rather than defaulted upstream: Crossref
# wants a real address for whoever runs the query, and the reusable workflow
# lives in a public repository.

on:
  pull_request:
    paths:
      - "references.bib"
      - ".github/workflows/VerifyReferences.yml"
  push:
    branches: [main]
    paths:
      - "references.bib"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: pen-sotashimozono/.github/.github/workflows/paper-verify-references.yml@v1
    with:
      contact-email: souta.shimozono@gmail.com
