name: Verify references

# Thin caller. contact-email is passed rather than defaulted upstream: Crossref
# wants a real address for whoever runs the query, and the reusable workflow
# lives in a public repository.

on:
  pull_request:
    paths:
      - "references.bib"
      - "refs/*.pdf"
      - ".github/scripts/bib_files.py"
      - ".github/workflows/VerifyReferences.yml"
  push:
    branches: [main]
    paths:
      - "references.bib"
      - "refs/*.pdf"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: pen-sotashimozono/.github/.github/workflows/paper-verify-references.yml@v1
    with:
      contact-email: souta.shimozono@gmail.com

  # Every entry with refs/<key>.pdf carries file = {refs/<key>.pdf}, and no
  # other does. Derived by bib_files.py (refs_sync.sh runs it); this only checks.
  file-fields:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/bib_files.py --check
