name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without 'v' prefix (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve version and verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      has-supplemental: ${{ steps.check.outputs.has-supplemental }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches VERSION
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          EXPECTED="v$(cat VERSION)"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "ERROR: tag '${TAG}' does not match VERSION ('${EXPECTED}')"
            exit 1
          fi

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Check for supplemental.tex
        id: check
        run: |
          if [ -f supplemental.tex ]; then
            echo "has-supplemental=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-supplemental=false" >> "$GITHUB_OUTPUT"
          fi

  build-paper:
    name: Build paper
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          pre_compile: mkdir -p out

      - uses: actions/upload-artifact@v7
        with:
          name: paper
          path: out/main.pdf

      - name: Package arXiv bundle
        run: |
          mkdir arxiv-src
          cp main.tex arxiv-src/
          cp out/main.bbl arxiv-src/ 2>/dev/null || true
          find figures -name "*.pdf" -exec cp {} arxiv-src/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: arxiv-src
          path: arxiv-src/

  build-diff:
    name: Build latexdiff PDF
    needs: [setup]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find previous tag
        id: tags
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^${{ needs.setup.outputs.tag }}$" | head -1)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"

      # Materialise the previous revision as a directory tree (git only, no TeX
      # on the runner); the flattening itself happens inside the LaTeX
      # container below, which is where latexpand lives.
      - name: Check out the previous revision into prev_rev/
        if: steps.tags.outputs.prev != ''
        run: |
          set -euo pipefail
          mkdir -p prev_rev
          git archive "${{ steps.tags.outputs.prev }}" | tar -x -C prev_rev

      # latexdiff on main.tex alone shows nothing when the change lives in an
      # \input child, which is where the content sits once the document is
      # split into notes/*.tex — so flatten both revisions first.
      - name: Compile latexdiff
        if: steps.tags.outputs.prev != ''
        uses: xu-cheng/latex-action@v4
        with:
          root_file: diff.tex
          latexmk_use_lualatex: true
          pre_compile: |
            mkdir -p out
            (cd prev_rev && latexpand main.tex > ../prev_flat.tex)
            latexpand main.tex > new_flat.tex
            latexdiff prev_flat.tex new_flat.tex > diff.tex

      - uses: actions/upload-artifact@v7
        if: steps.tags.outputs.prev != ''
        with:
          name: diff
          path: out/diff.pdf

  build-supplementary:
    name: Build supplementary
    needs: [setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.has-supplemental == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: supplemental.tex
          latexmk_use_lualatex: true
          pre_compile: mkdir -p out

      - uses: actions/upload-artifact@v7
        with:
          name: supplementary
          path: out/supplemental.pdf

  release:
    name: GitHub Release
    needs: [setup, build-paper, build-diff, build-supplementary]
    runs-on: ubuntu-latest
    if: always() && needs.setup.result == 'success' && needs.build-paper.result == 'success' && needs.build-diff.result != 'cancelled' && (needs.build-supplementary.result == 'success' || needs.build-supplementary.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dl/

      # Release notes as text: the commit log since the previous tag, plus this
      # version's CHANGELOG entry if there is one. Without this the release
      # body is empty and the only way to see what changed is to open a PDF.
      - name: Compose release notes
        run: |
          set -euo pipefail
          V="${{ needs.setup.outputs.tag }}"
          PREV=$(git tag --sort=-v:refname | grep -v "^${V}$" | head -1 || true)
          {
            if [ -f CHANGELOG.md ]; then
              awk -v v="## ${V#v} " '
                index($0, v) == 1 { on = 1; next }
                on && /^## / { exit }
                on { print }
              ' CHANGELOG.md | sed '/^$/{ x; /./d; x; }'
            fi
            if [ -n "$PREV" ]; then
              echo
              echo "### Commits since ${PREV}"
              echo
              git log --no-merges --format='- %s' "${PREV}..${V}" 2>/dev/null \
                || git log --no-merges --format='- %s' "${PREV}..HEAD"
              echo
              echo "Source diff: \`git diff ${PREV} ${V} -- '*.tex'\` — or \`./scripts/diff.sh ${PREV} ${V}\` for a rendered latexdiff."
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Prepare release assets
        run: |
          V="${{ needs.setup.outputs.tag }}"
          mkdir release
          [ -f dl/paper/main.pdf ]                 && mv dl/paper/main.pdf                 "release/paper-${V}.pdf"
          [ -f dl/diff/diff.pdf ]                  && mv dl/diff/diff.pdf                  "release/diff-${V}.pdf"
          [ -f dl/supplementary/supplemental.pdf ] && mv dl/supplementary/supplemental.pdf "release/supplemental-${V}.pdf"
          [ -d dl/arxiv-src ]                      && (cd dl/arxiv-src && zip "../../release/arxiv-bundle-${V}.zip" ./*)

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: release/*
          body_path: release_notes.md
          generate_release_notes: true
