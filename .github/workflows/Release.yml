name: Release

# Releases one document from docs.toml. The tag is <document>-v<version>, so
# each root document carries its own ladder and its own release history.
#
# Everything mechanical is derived from the document id: the root .tex, the
# build output, the tag, and the asset names. Adding a document to docs.toml is
# enough — nothing here enumerates them.

on:
  push:
    tags: ["*-v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      document:
        description: "Document id as it appears in docs.toml (e.g. main)"
        required: true
      version:
        description: "Version without 'v' prefix (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('{0}-v{1}', inputs.document, inputs.version) || github.ref_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Resolve document and verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      document: ${{ steps.ver.outputs.document }}
      root: ${{ steps.ver.outputs.root }}
      stem: ${{ steps.ver.outputs.stem }}
      arxiv: ${{ steps.ver.outputs.arxiv }}
      has-supplemental: ${{ steps.check.outputs.has-supplemental }}
    steps:
      - uses: actions/checkout@v7

      # A pushed tag carries the document in its own name, so both entry points
      # end up with the same (document, version) pair and one code path below.
      - name: Resolve document and tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DOC="${{ inputs.document }}"
            VER="${{ inputs.version }}"
          else
            DOC="${GITHUB_REF_NAME%-v*}"
            VER="${GITHUB_REF_NAME##*-v}"
          fi

          EXPECTED="$(python3 scripts/docs.py version "$DOC")"
          if [ "$VER" != "$EXPECTED" ]; then
            echo "ERROR: ${DOC} is at ${EXPECTED} in docs.toml, but this release is for ${VER}"
            exit 1
          fi

          ROOT="$(python3 scripts/docs.py root "$DOC")"
          {
            echo "document=${DOC}"
            echo "tag=${DOC}-v${VER}"
            echo "root=${ROOT}"
            echo "stem=$(basename "${ROOT}" .tex)"
            echo "arxiv=$(python3 scripts/docs.py get "$DOC" arxiv)"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on remote — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Check for supplemental.tex
        id: check
        run: |
          if [ -f supplemental.tex ]; then
            echo "has-supplemental=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-supplemental=false" >> "$GITHUB_OUTPUT"
          fi

  build-document:
    name: Build document
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The bundle is flattened, not copied. A root that pulls in styles/ or
      # notes/ children through \input is not self-contained, and arXiv gets
      # only what is in the tarball -- an unflattened copy fails there with
      # "File not found" after the build looked perfectly healthy here.
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ needs.setup.outputs.root }}
          latexmk_use_lualatex: true
          pre_compile: mkdir -p out
          post_compile: |
            if [ "${{ needs.setup.outputs.arxiv }}" = "true" ]; then
              mkdir -p arxiv-src
              latexpand "${{ needs.setup.outputs.root }}" > "arxiv-src/${{ needs.setup.outputs.stem }}.tex"
              cp "out/${{ needs.setup.outputs.stem }}.bbl" arxiv-src/ 2>/dev/null || true
              find figures -name "*.pdf" -exec cp {} arxiv-src/ \; 2>/dev/null || true
            fi

      - uses: actions/upload-artifact@v7
        with:
          name: document
          path: out/${{ needs.setup.outputs.stem }}.pdf

      - uses: actions/upload-artifact@v7
        if: needs.setup.outputs.arxiv == 'true'
        with:
          name: arxiv-src
          path: arxiv-src/

  build-diff:
    name: Build latexdiff PDF
    needs: [setup]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only this document's own tags: a notes release must diff against the
      # previous notes, not against whatever was tagged most recently.
      - name: Find previous tag for this document
        id: tags
        env:
          DOC: ${{ needs.setup.outputs.document }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          PREV=$(git tag --list "${DOC}-v*" --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"

      # Materialise the previous revision as a directory tree (git only, no TeX
      # on the runner); the flattening itself happens inside the LaTeX
      # container below, which is where latexpand lives.
      - name: Check out the previous revision into prev_rev/
        if: steps.tags.outputs.prev != ''
        run: |
          set -euo pipefail
          mkdir -p prev_rev
          git archive "${{ steps.tags.outputs.prev }}" | tar -x -C prev_rev

      # latexdiff on the root alone shows nothing when the change lives in an
      # \input child, which is where the content sits once the document is
      # split into notes/*.tex — so flatten both revisions first.
      - name: Compile latexdiff
        if: steps.tags.outputs.prev != ''
        uses: xu-cheng/latex-action@v4
        with:
          root_file: diff.tex
          latexmk_use_lualatex: true
          pre_compile: |
            mkdir -p out
            (cd prev_rev && latexpand "${{ needs.setup.outputs.root }}" > ../prev_flat.tex)
            latexpand "${{ needs.setup.outputs.root }}" > new_flat.tex
            latexdiff prev_flat.tex new_flat.tex > diff.tex

      - uses: actions/upload-artifact@v7
        if: steps.tags.outputs.prev != ''
        with:
          name: diff
          path: out/diff.pdf

  build-supplementary:
    name: Build supplementary
    needs: [setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.has-supplemental == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: supplemental.tex
          latexmk_use_lualatex: true
          pre_compile: mkdir -p out

      - uses: actions/upload-artifact@v7
        with:
          name: supplementary
          path: out/supplemental.pdf

  release:
    name: GitHub Release
    needs: [setup, build-document, build-diff, build-supplementary]
    runs-on: ubuntu-latest
    if: always() && needs.setup.result == 'success' && needs.build-document.result == 'success' && needs.build-diff.result != 'cancelled' && (needs.build-supplementary.result == 'success' || needs.build-supplementary.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dl/

      # Release notes as text: the commit log since this document's previous
      # tag, plus this version's CHANGELOG entry if there is one. Without this
      # the release body is empty and the only way to see what changed is to
      # open a PDF.
      - name: Compose release notes
        env:
          DOC: ${{ needs.setup.outputs.document }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list "${DOC}-v*" --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          {
            if [ -f CHANGELOG.md ]; then
              awk -v v="## ${TAG} " '
                index($0, v) == 1 { on = 1; next }
                on && /^## / { exit }
                on { print }
              ' CHANGELOG.md | sed '/^$/{ x; /./d; x; }'
            fi
            if [ -n "$PREV" ]; then
              echo
              echo "### Commits since ${PREV}"
              echo
              git log --no-merges --format='- %s' "${PREV}..${TAG}" 2>/dev/null \
                || git log --no-merges --format='- %s' "${PREV}..HEAD"
              echo
              echo "Source diff: \`git diff ${PREV} ${TAG} -- '*.tex'\` — or \`./scripts/diff.sh ${PREV} ${TAG}\` for a rendered latexdiff."
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Prepare release assets
        env:
          TAG: ${{ needs.setup.outputs.tag }}
          STEM: ${{ needs.setup.outputs.stem }}
        run: |
          set -euo pipefail
          mkdir release
          if [ -f "dl/document/${STEM}.pdf" ]; then
            mv "dl/document/${STEM}.pdf" "release/${TAG}.pdf"
          fi
          if [ -f dl/diff/diff.pdf ]; then
            mv dl/diff/diff.pdf "release/diff-${TAG}.pdf"
          fi
          if [ -f dl/supplementary/supplemental.pdf ]; then
            mv dl/supplementary/supplemental.pdf "release/supplemental-${TAG}.pdf"
          fi
          if [ -d dl/arxiv-src ]; then
            (cd dl/arxiv-src && zip "../../release/arxiv-bundle-${TAG}.zip" ./*)
          fi
          echo "Assets:"
          ls -1 release/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          files: release/*
          body_path: release_notes.md
          generate_release_notes: true
