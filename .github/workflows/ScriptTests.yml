name: Script Tests

# docs.py / exports.py / bib_files.py and the figure tools (.github/tools/)
# against throwaway repositories, and a real LibreOffice build of the fixtures.
# Runs only when the machinery changes.

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/tools/**"
      - ".github/actions/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/tools/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/libreoffice
      - run: python3 -m unittest discover -s .github/scripts/tests -v
