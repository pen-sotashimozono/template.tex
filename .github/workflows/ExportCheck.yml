name: Export Check

# Each export's PDF matches its source, and (on a PR) its version moved
# exactly when the source did.

on:
  pull_request:
    paths:
      - "**/*.pptx"
      - "**/*.docx"
      - "**/*.pdf"
      - "**/*.pdf.sha256"
      - "docs.toml"
      - ".github/scripts/exports.py"
      - ".github/scripts/docs.py"
      - ".github/workflows/ExportCheck.yml"
  push:
    branches: [main]
    paths:
      - "**/*.pptx"
      - "**/*.docx"
      - "**/*.pdf"
      - "**/*.pdf.sha256"
      - "docs.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: PDF matches its source
        run: python3 .github/scripts/exports.py check

      - name: Version moved with the source
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git show "origin/${BASE_REF}:docs.toml" > base-docs.toml 2>/dev/null || : > base-docs.toml
          python3 .github/scripts/exports.py check-bump --base base-docs.toml --base-ref "origin/${BASE_REF}"
