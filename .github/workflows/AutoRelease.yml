name: Auto Release

# Thin caller. The merged guard is repeated inside the reusable workflow, since
# a pull_request checkout resolves to the PR's own tree and a closed-unmerged
# PR would otherwise release the bump it was carrying.
# `docs.py ids` lists LaTeX documents only, so exports get their own job.
#
# `rename` runs first. A document's id is in its tags, and "has this version a
# tag?" is how the two jobs after it decide what to release. A PR that renames
# a table in docs.toml would otherwise have the document released again under
# its new id, as if it were new and with no diff, while its history stayed
# under the old one. The job holds the release back until the tags have been
# moved by hand (rename_releases.py), and says how.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  rename:
    name: Have the releases of a renamed document been moved?
    if: github.event.pull_request.merged == true
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # This job finds a rename and stops; it does not move anything. Moving a
      # release means making a tag on an old commit, and the token a workflow
      # runs with may not: where the workflow files of that commit differ from
      # today's, GitHub takes the tag for a change to a workflow and refuses it,
      # by push and through the API alike (tried here, 2026-10-12). Someone
      # signed in to GitHub can, so the move is one command on their machine.
      #
      # Against the commit main was at before the merge: the first parent, for
      # a merge commit and a squash alike.
      - name: Stop until the tags of each renamed document have been moved
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          RENAMED="$(python3 .github/scripts/rename_releases.py --renamed-since HEAD^1)"
          if [ -z "$RENAMED" ]; then
            echo "No document was renamed."
            exit 0
          fi
          # Said by hand, for what cannot be seen from the tags: two documents
          # that traded ids both have tags before and after.
          if gh pr view "$PR" --json labels -q '.labels[].name' | grep -qx 'releases-renamed'; then
            echo "The pull request is labelled releases-renamed: taken as done."
            exit 0
          fi
          git fetch --quiet --tags --force origin
          TODO="$(echo "$RENAMED" | while read -r OLD NEW; do
            if git tag --list "v[0-9]*-${OLD}" "${OLD}-v[0-9]*" | grep -q .; then
              echo "python3 .github/scripts/rename_releases.py ${OLD} ${NEW} --apply"
            fi
          done)"
          if [ -n "$TODO" ]; then
            # Every step then, also the one that starts from the id a swap
            # passes through, which has no tag until the step before it has run.
            TODO="$(echo "$RENAMED" | sed 's|^\([^ ]*\) \(.*\)$|python3 .github/scripts/rename_releases.py \1 \2 --apply|')"
          fi
          if [ -z "$TODO" ]; then
            echo "Renamed, and no tag is left under an old id:"
            echo "$RENAMED" | sed 's/ / -> /; s/^/  /'
            exit 0
          fi
          echo "::error::A document was renamed in docs.toml and its releases still carry the old id. Nothing is released until they are moved."
          {
            echo "### Releases to move"
            echo
            echo "A document was renamed in \`docs.toml\`. Its tags, releases and attached files still carry the old id, and releasing now would start the document again under the new one, with no history."
            echo
            echo "On a machine signed in to GitHub (\`gh auth status\`), on an up-to-date \`main\`, in this order:"
            echo
            echo '```sh'
            echo "$TODO"
            echo 'git commit -m "chore: changelog headings follow the renamed document" .github/CHANGELOG.md   # then push it, by a PR or directly'
            echo '```'
            echo
            echo "Then re-run this job. It passes when no tag is left under an old id. For two documents that traded ids that cannot be seen, so say it: label this pull request \`releases-renamed\` and re-run."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  release:
    needs: rename
    if: github.event.pull_request.merged == true
    uses: pen-sotashimozono/.github/.github/workflows/paper-auto-release.yml@v1
    permissions:
      contents: write
      actions: write

  exports:
    name: Tag and release each export with a new version
    needs: rename
    if: github.event.pull_request.merged == true
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","rosina"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Dispatch a release per newly bumped export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Assigned first: a failing $(...) in a for list does not trip set -e.
          IDS="$(python3 .github/scripts/exports.py ids)"
          for DOC in $IDS; do
            # No source committed yet: nothing to release.
            SRC="$(python3 .github/scripts/exports.py source "$DOC")"
            if [ ! -f "$SRC" ]; then
              echo "${DOC}: no source committed yet. No release."
              continue
            fi
            V="$(python3 .github/scripts/docs.py version "$DOC")"
            TAG="$(python3 .github/scripts/docs.py tag "$DOC")"
            if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
              echo "${DOC}: ${TAG} already exists — version was not bumped. No release."
              continue
            fi
            echo "${DOC}: new version ${V} — dispatching Release.yml for ${TAG}."
            gh workflow run Release.yml --ref main --field document="${DOC}" --field version="${V}"
          done
