name: Sync tikz-tensors

# The template itself follows tikz-tensors: every four hours (or on demand) it moves
# the submodule to tikz-tensors' main -- which is always its newest release --
# rebuilds the example figures with it, checks the pin and the scripts,
# compiles every document, and commits the result to main. Nothing happens when main has not moved.
#
# Only the template runs this. A repository made from it chooses when to move
# (tikz-tensors.sh pin), so Initialize.yml deletes this file with itself.

on:
  schedule:
    - cron: "17 */4 * * *"   # every four hours, at :17
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # to report a sync that fails

concurrency:
  group: sync-tikz-tensors
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'pen-sotashimozono/template.tex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Move the pin to tikz-tensors' main
        id: pin
        run: |
          before="$(git ls-files -s .github/tools/figures/tikz-tensors | awk '{print $2}')"
          .github/tools/figures/tikz-tensors.sh pin latest | tee pin.log
          after="$(git ls-files -s .github/tools/figures/tikz-tensors | awk '{print $2}')"
          tag="$(sed -n 's/.*pinned at \(v[0-9.]*\).*/\1/p' pin.log)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "Already at tikz-tensors main ($tag); nothing to do."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: TeX-Live/setup-texlive-action@v4
        if: steps.pin.outputs.moved == 'true'
        with:
          packages: |
            scheme-basic
            collection-luatex
            collection-latexrecommended
            collection-fontsrecommended
            collection-pictures
            latexmk
            standalone
            xkeyval
            currfile
            filehook
            gincltex
            svn-prov
            adjustbox
            collectbox
            braket

      - name: Rebuild the example figures
        if: steps.pin.outputs.moved == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          .github/tools/figures/build.sh --force --pdf

      - name: Check the pin and the scripts
        if: steps.pin.outputs.moved == 'true'
        run: |
          .github/tools/figures/tikz-tensors.sh check
          python3 -m unittest discover -s .github/scripts/tests

      # The commit below is pushed with GITHUB_TOKEN, and a push made with it
      # starts no workflow: LaTeX CI never sees it. So the documents are
      # compiled here, before the commit, in the container CI uses. A release
      # of tikz-tensors that breaks a document stops the sync and leaves main
      # as it was.
      - name: List the documents
        id: docs
        if: steps.pin.outputs.moved == 'true'
        run: |
          {
            echo "roots<<EOF"
            for id in $(python3 .github/scripts/docs.py ids); do python3 .github/scripts/docs.py root "$id"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile every document with the new pin
        if: steps.pin.outputs.moved == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.docs.outputs.roots }}
          latexmk_use_lualatex: true
          pre_compile: mkdir -p out

      - name: Commit to main
        if: steps.pin.outputs.moved == 'true'
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/tools/figures/tikz-tensors figures/generated
          git commit -m "chore: tikz-tensors $TAG (sync with its main)"
          git push origin HEAD:main

      # A sync that fails does so again every four hours, and until now the
      # failed run was the only trace: tikz-tensors went unsynced for ten days
      # in October 2026 before anyone looked. One issue is opened, left alone
      # while the failure lasts, and closed by the first run that works.
      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "The tikz-tensors sync is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            -q '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [ -n "$open" ]; then
            echo "Already reported in #$open."
          else
            gh issue create --title "$TITLE" --body "The sync of tikz-tensors (SyncTikzTensors.yml) failed: $RUN_URL

          It runs every four hours and will go on failing until this is fixed; the pin on main stays where it was. This issue is closed by the first run that succeeds."
          fi

      - name: Close the report once the sync works again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "The tikz-tensors sync is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            -q '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Works again: $RUN_URL"
          fi
