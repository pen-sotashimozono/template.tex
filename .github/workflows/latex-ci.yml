name: LaTeX CI

# Thin caller. The build, the document matrix and the closure-aware bump check
# live in pen-sotashimozono/.github so every paper repository runs the same
# pipeline; only the triggers are ours. .github/scripts/ stays here, because
# bump.sh and diff.sh are run by hand and import docs.py and closure.py from
# that directory.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: pen-sotashimozono/.github/.github/workflows/paper-build.yml@v1
