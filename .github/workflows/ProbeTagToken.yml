name: Probe (not for merging)
on: pull_request
permissions:
  contents: write
jobs:
  probe:
    if: github.head_ref == 'test/probe-tag-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          # Does moving a release to a tag that does not exist make GitHub create it, on an old commit?
          t=v0.0.13-notes
          sha="$(git rev-parse "refs/tags/$t^{commit}")"
          id="$(gh api "repos/$R/releases/tags/$t" -q .id)"
          if gh api -X PATCH "repos/$R/releases/$id" -f tag_name=zzprobe-rel -f target_commitish="$sha" -q '"PATCH ok: tag=\(.tag_name) draft=\(.draft)"' 2>err.txt; then
            echo "tag now at: $(git ls-remote --tags origin refs/tags/zzprobe-rel | cut -f1) (wanted $sha)"
          else
            echo "release PATCH: REFUSED: $(head -2 err.txt)"
          fi
          gh api -X PATCH "repos/$R/releases/$id" -f tag_name="$t" -q '"restored: tag=\(.tag_name) draft=\(.draft)"'
          gh api -X DELETE "repos/$R/git/refs/tags/zzprobe-rel" 2>/dev/null && echo "probe tag deleted" || echo "no probe tag to delete"
