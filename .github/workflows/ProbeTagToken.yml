name: Probe (not for merging)
on: pull_request
permissions:
  contents: write
jobs:
  probe:
    if: github.head_ref == 'test/probe-tag-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          for t in v0.0.13-notes notes-v0.0.11 v0.0.17-notes; do
            sha="$(git rev-parse "refs/tags/$t^{commit}")"
            echo "== $t ($sha)"
            if gh api "repos/$R/git/refs" -f ref="refs/tags/zzprobe-$t" -f sha="$sha" >/dev/null 2>err.txt; then
              echo "API create: ok"
              gh api -X DELETE "repos/$R/git/refs/tags/zzprobe-$t" && echo "API delete: ok"
            else
              echo "API create: REFUSED: $(cat err.txt | head -2)"
            fi
            if git push -q origin "$sha:refs/tags/zzprobe-push-$t" 2>err.txt; then
              echo "git push: ok"; git push -q origin ":refs/tags/zzprobe-push-$t" && echo "git push delete: ok"
            else
              echo "git push: REFUSED: $(grep -o 'refusing[^)]*' err.txt | head -1)"
            fi
          done
